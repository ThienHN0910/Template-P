name: Scaffold Matrix

on:
  pull_request:
    branches: [main]
    paths:
      - packages/cli/**
      - templates/**
      - scripts/verify-scaffold-matrix.mjs
      - .github/workflows/scaffold-matrix.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scaffold-install-build-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: node
            architecture: blank
            package_manager: npm
          - backend: dotnet
            architecture: blank
            package_manager: pnpm
          - backend: fastapi
            architecture: blank
            package_manager: npm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Setup .NET
        if: matrix.backend == 'dotnet'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Setup Python
        if: matrix.backend == 'fastapi'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install CLI dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packed CLI artifact
        run: pnpm build

      - name: Verify scaffold, install, build, and health
        env:
          MATRIX_BACKEND: ${{ matrix.backend }}
          MATRIX_ARCHITECTURE: ${{ matrix.architecture }}
          MATRIX_PACKAGE_MANAGER: ${{ matrix.package_manager }}
        run: node scripts/verify-scaffold-matrix.mjs
