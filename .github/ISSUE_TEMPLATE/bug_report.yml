name: 🐛 Bug Report
description: File a bug report to help us fix issues in @thienhn/create-template
title: "[Bug]: "
labels: ["needs-triage", "bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible.
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
      placeholder: What went wrong?
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command Executed
      description: What exact command did you run?
      placeholder: e.g. npx @thienhn/create-template my-app --backend dotnet --frontend vue3
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: OS, Node.js version, package manager version.
      placeholder: |
        - OS: Windows 11 / macOS Sonoma / Ubuntu 24.04
        - Node version: v20.x or v22.x
        - Package Manager: pnpm / npm / bun
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal Output / Error Logs
      description: Paste any error messages or terminal logs here.
      render: shell
